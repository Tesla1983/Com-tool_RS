# 门禁自动化 —— 与 `HANDOVER.md` §7 / `DEVELOPMENT_GUIDE.md` §6 里那四项保持一致：
#   fmt --check 干净 · check --all-targets 0 warning · test 全绿 · clippy --all-targets 0 warning
#
# ⚠️ 只在 windows-latest 上跑，**不是偷懒**：本项目是 Windows 串口工具，eframe 开着
# `wayland` / `glow` feature，在 Linux runner 上要先装 libxkbcommon / libwayland /
# X11 开发库才能编过，而 CI 绿不绿与"串口能不能通"无关——把时间花在真正的门禁上。
# 401 条测试全部不需要真实串口硬件（替身通道 + 无头渲染），所以在 runner 上能全跑。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发：改了工作流本身、或想在不推送的情况下验一次时用。
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 让 CI 与本机输出一致：warning 行不折叠、进度条关掉。
  RUSTFLAGS: ""

jobs:
  gate:
    name: 门禁（windows-latest · stable）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 stable 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 目录
        uses: Swatinem/rust-cache@v2

      - name: 1/4 格式
        run: cargo fmt --check

      - name: 2/4 编译（含测试目标）
        run: cargo check --all-targets --locked

      # clippy 是 rustc lint 的**超集**，所以这一步同时覆盖门禁里的"check 0 warning"：
      # `-D warnings` 只作用于本仓库自己的 crate（cargo 不会把 `--` 之后的标志传给依赖）。
      - name: 3/4 静态检查
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 4/4 测试
        run: cargo test --locked

  # MSRV 单独一个 job：它跑的是**声明的最低版本**，不是 stable。
  # 1.95 这个下限是依赖给的（`egui` / `eframe` / `egui_plot` 自己的 `rust-version`），
  # 不是我们的代码给的——详见 `Cargo.toml` 里 `rust-version` 的注释。
  # 这里只 `check`：老工具链上跑全套测试意义不大（被测的是我们的代码，不是编译器），
  # 真正要守住的是"更老的工具链根本编不过"这个契约。
  msrv:
    name: MSRV（1.95）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 1.95 工具链
        uses: dtolnay/rust-toolchain@1.95.0

      - name: 缓存 cargo 目录
        uses: Swatinem/rust-cache@v2

      - name: 用声明的最低版本编译
        run: cargo check --all-targets --locked
