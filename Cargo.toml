[package]
name = "comtool-rs"
version = "0.1.0"
edition = "2024"
# 最低支持的 Rust 版本（MSRV）= **1.95**，下限是**依赖给的，不是我们的代码给的**：
# `egui` / `eframe` / `ecolor` / `epaint` 0.36.2 与 `egui_plot` 0.37.0 四份 manifest
# 里都写着 `rust-version = "1.95"`，cargo 在 1.88 上会直接拒绝解析（实测报错原文见
# `HISTORY_2026.md` §3.38 ①）。
#
# ⚠️ 别把它当成"我们自己需要多新的编译器"：本仓库源码只用到了 edition 2024（1.85）
# 和 `slice::as_chunks`（1.88），**1.95 是被 UI 依赖抬上去的**。所以往下降这条路
# 不在我们手上——降 egui 大版本会改一堆 API；而往上升只要依赖升了就同步改这一行。
#
# 声明它的收益：MSRV 变成**编译期可查的契约**——更老的工具链会被 cargo 当场拒绝并
# 报出是哪个包在要求，clippy 的 `incompatible_msrv` 也会据此判断某个 API 能不能用。
rust-version = "1.95"
description = "串口调试上位机（GUI 串口助手）：串口 / TCP / UDP、HEX 与字节视图、实时图表、文件日志、筛选、15 种语言"
# GPL-3.0-only（不是 -or-later）：上游 SerialGUI-rs 只声明 GPLv3 单一许可，
# 本作品是它的修改版 ⇒ 沿用同一档，不能替上游追加"或更新版本"。
# 合规声明与逐字重合度实测见 `NOTICE.md`；分发检查清单也在那里。
license = "GPL-3.0-only"

[profile.release]
# 与上游保持一致：release 使用 opt-level = 2，而不是 Rust 默认的 3。
# 这是一款每次重绘都要跑一遍布局与文本排版的 GUI 程序，热点在串口 IO 与
# egui 布局，不在算术；少一档优化几乎不影响体感，却能明显缩短 release
# 构建时间。注意这是**下调**：不写这一节时 Rust 默认就是 3。
opt-level = 2

[dependencies]
egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland"] }
# 绘图控件。版本号与 egui 并不同步：egui_plot 0.37 才依赖 egui ^0.36，
# 0.36 依赖的是 egui ^0.35，升级前务必核对（见 DEVELOPMENT_GUIDE §2）。
egui_plot = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
# 开启 `serde` — serialport 用它给 DataBits/StopBits/Parity/FlowControl 派生
# Serialize/Deserialize，这样端口参数可以直接随应用状态落盘，不必再写一层
# 枚举与字符串之间的手写转换。
serialport = { version = "4.7.2", features = ["serde"] }
# chrono 只用于日志文件名的时间戳格式化（P4 起在用）。
chrono = "0.4.45"
# 接收 / 发送的字符编码（F2 起在用）：GBK / GB18030 这类遗留编码的**增量解码**。
# 它的 `Decoder` 会把"被截断的多字节序列"留在内部等下一批，因此跨包拼接不会退化
# 成 lossy；Mozilla 维护、纯 Rust、无 C 依赖。这是本项目唯一为 F2 新增的依赖，
# 也因此 `FEATURE_GAP_AND_PLAN.md` §8 里"依赖集是最终形态"那句要同步加例外说明。
encoding_rs = "0.8.35"
# rfd 提供「选择输出目录」的原生对话框（P4 起在用）。
rfd = "0.17.2"
# 已移除的两个死依赖（P6 收尾）：
# - `tokio`：全项目零调用。串口与日志写盘都用 std 线程 + mpsc，版本检查也
#   只会有一次带超时的请求，用不上 runtime；而 `features = ["full"]` 曾明显
#   拖慢编译。
# - `egui-chinese-font`：零调用。中文字体是 `main.rs::setup_fonts` 直接读
#   `C:\Windows\Fonts` 下的系统字体并挂进回退链的，没有走这个 crate。
