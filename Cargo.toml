[package]
name = "comtool-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serialport = "4.7.2"
chrono = "0.4.45"
egui-chinese-font = "0.2.0"
rfd = "0.17.2"
tokio = { version = "1.53.1", features = ["full"] }